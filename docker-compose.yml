# SpeedyGo backend local dependencies only.
# Application process runs on the host (`pnpm start:dev`).
#
# Ports:
#   PostgreSQL  5433 (host) → 5432 (container) — avoids collision with Homebrew/other Postgres on 5432
#   Redis       6381 (host) → 6379 (container) — avoids collision with other local Redis on 6379
#   MinIO API   9000
#   MinIO UI    9001
#   ClamAV      3311 (host) → 3310 (container) — private malware scanning for verification uploads
#
# Usage:
#   docker compose up -d
#   docker compose down

name: speedygo-backend

services:
  postgres:
    # Prefer a local build on postgres:16-alpine + Alpine PostGIS packages.
    # Official postgis/postgis:16-3.5 is the upstream alternative when Docker Hub is reachable.
    build:
      context: ./docker/postgres-postgis
    image: speedygo-postgres-postgis:16
    container_name: speedygo-postgres
    restart: unless-stopped
    ports:
      # Host 5433 keeps SpeedyGo isolated from Homebrew/other Postgres on 5432.
      # Inside the Compose network the service remains postgres:5432.
      - '${SPEEDYGO_POSTGRES_HOST_PORT:-5433}:5432'
    environment:
      POSTGRES_USER: speedygo
      POSTGRES_PASSWORD: speedygo
      POSTGRES_DB: speedygo_dev
    volumes:
      - speedygo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U speedygo -d speedygo_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: speedygo-redis
    restart: unless-stopped
    ports:
      # Host 6381 keeps SpeedyGo isolated from other projects that bind 6379.
      # Inside the Compose network the service remains redis:6379.
      - '${SPEEDYGO_REDIS_HOST_PORT:-6381}:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - speedygo_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: speedygo-minio
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: speedygo
      MINIO_ROOT_PASSWORD: speedygo_dev_password
    command: ['server', '/data', '--console-address', ':9001']
    volumes:
      - speedygo_minio_data:/data

  clamav:
    # Pinned ClamAV image for local/E2E malware scanning (host 3311 → container 3310).
    image: clamav/clamav:1.4.6-debian13-slim
    container_name: speedygo-clamav
    restart: unless-stopped
    ports:
      - '${SPEEDYGO_CLAMAV_HOST_PORT:-3311}:3310'
    volumes:
      - speedygo_clamav_data:/var/lib/clamav
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'echo PING | nc -w 2 127.0.0.1 3310 | grep -q PONG || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 40
      start_period: 180s

volumes:
  speedygo_postgres_data:
  speedygo_redis_data:
  speedygo_minio_data:
  speedygo_clamav_data:
